name: Pull Request Check

on:
  pull_request:
    branches: [main, dev]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'README.md'
      - 'AGENT_GUIDE.md'
      - 'agent_docs/**'
      - 'samples/**'
      - 'AIPlan/**'
      - '.github/workflows/release.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  lint-check:
    name: Lint Check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts

      - name: Run ESLint
        run: npm run lint

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts

      - name: Run TypeScript check
        run: npm run typecheck

  architecture-compliance:
    name: 🔴 Blueprint Architecture Compliance
    runs-on: ubuntu-latest
    needs: [type-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts

      - name: Run blueprint architecture compliance tests
        run: npm run test:architecture

  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    needs: [type-check, architecture-compliance]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (skip scripts)
        run: npm ci --ignore-scripts

      - name: Run Vitest tests
        run: npm run test

      - name: Run coverage check
        run: npm run test:coverage
        continue-on-error: true

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          files: coverage/frontend/lcov.info
          flags: frontend
          name: dvstudio-frontend-coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  python-bridge-check:
    name: Python Bridge Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check Python syntax (compile all .py files)
        run: |
          python -m py_compile electron/backend/python-bridge/scripts/worker.py
          python -m py_compile electron/backend/python-bridge/scripts/common/rpc.py
          python -m py_compile electron/backend/python-bridge/scripts/common/worker_logging.py
          python -m py_compile electron/backend/python-bridge/scripts/subtitle/__init__.py
          python -m py_compile electron/backend/python-bridge/scripts/subtitle/handlers.py
          python -m py_compile electron/backend/python-bridge/scripts/subtitle/utils.py
        shell: bash

      - name: Verify Python worker can start and respond to ping
        run: |
          cd electron/backend/python-bridge/scripts
          echo '{"jsonrpc":"2.0","id":"test-ping","method":"ping","params":{}}' | timeout 10 python worker.py --log-level WARN 2>/dev/null | head -5
        shell: bash
        continue-on-error: true

  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [frontend-test, python-bridge-check]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vite build
        run: npx vite build
